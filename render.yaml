services:
  - type: web
    name: zubite-api
    runtime: docker
    region: frankfurt
    # Start without a billing dependency; upgrade to Starter before launch if
    # always-on capacity is required.
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_NAME
        value: zubite
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://zubite.bg
      - key: PRODUCTION_URL
        value: https://zubite.bg
      - key: CORS_ORIGINS
        value: https://zubite.bg,https://www.zubite.bg
      - key: AUTH_COOKIE_SECURE
        value: "1"
      - key: AUTH_COOKIE_SAMESITE
        value: lax
      - key: AUDIT_LOGS_ENABLED
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      # Clear Advance. Both are set in the dashboard: the URL because it differs
      # per environment, the secret because it decrypts every connected clinic's
      # API key. Unset means clinics simply are not reported -- the same
      # unconfigured-is-valid rule the email sender follows.
      - key: CLEAR_ADVANCE_API_URL
        sync: false
      - key: CLEAR_ADVANCE_KEY_SECRET
        sync: false
      # Creates organisations in Clear Advance for new clinics. The most
      # sensitive value on this service: it makes tenants, not just leads.
      # Unset means new clinics wait, their enrolment marked not_configured.
      - key: CLEAR_ADVANCE_PARTNER_KEY
        sync: false
      - key: SENDER_EMAIL
        value: hello@zubite.bg
      # Only the two emails that bring a new clinic onto the platform: the
      # private intake invitation and the approval email with its first
      # credentials. Everything else — patient mail, clinic password resets,
      # chat and booking notifications — stays on SENDER_EMAIL. Unset falls
      # back to SENDER_EMAIL.
      - key: CLINIC_ONBOARDING_SENDER_EMAIL
        value: onboarding@zubite.bg
      - key: ZUBITE_ADMIN_NOTIFICATION_EMAIL
        value: info@zubite.bg
