<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Образователен портретен шаблон Zubite.bg</title>
  <desc id="desc">Топъл редакционен шаблон за обяснение на дентален сигнал с три практически стъпки.</desc>
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Regular.ttf')}@font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Bold.ttf');font-weight:700}@font-face{font-family:Playfair;src:url('../../fonts/taste/PlayfairDisplay-Regular.ttf')}@font-face{font-family:Plex;src:url('../../fonts/taste/IBMPlexMono-Medium.ttf');font-weight:600}
      .display{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-5px}.body{font-family:Manrope,Arial,sans-serif}.label{font-family:Plex,monospace;font-weight:600;letter-spacing:2.8px}.accent{font-family:Playfair,Georgia,serif;font-weight:400;font-style:italic}.brand{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-2.4px}
    </style>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#0A0A0A" stroke-opacity=".035" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0A0A0A" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="#F5F4F2"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <circle cx="1000" cy="132" r="210" fill="#D0FAE5" opacity=".72"/>
  <circle cx="1000" cy="132" r="126" fill="none" stroke="#007956" stroke-opacity=".14" stroke-width="3"/>

  <g transform="translate(72 72)">
    <text class="brand" x="0" y="34" font-size="38" fill="#0A0A0A">Zubite<tspan fill="#007956">.bg</tspan></text>
    <g transform="translate(0 72)">
      <rect width="286" height="42" rx="21" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
      <circle cx="24" cy="21" r="6" fill="#FF6B00"/>
      <text class="label" data-slot="eyebrow" x="44" y="27" font-size="17" fill="#0A0A0A">ОБЯСНЕНО ЯСНО · 01</text>
    </g>

    <text class="display" data-slot="headline" x="0" y="255" font-size="92" fill="#0A0A0A">
      <tspan x="0">Кървящите</tspan>
      <tspan x="0" dy="90">венци не са</tspan>
      <tspan class="accent" x="0" dy="96" fill="#007956" letter-spacing="-2">„нормални“.</tspan>
    </text>
    <rect x="0" y="538" width="122" height="10" rx="5" fill="#FF6B00"/>
    <text class="body" data-slot="body" x="0" y="610" font-size="30" fill="#525252">
      <tspan x="0">Това е сигнал, който заслужава внимание —</tspan>
      <tspan x="0" dy="46">без паника и без самолечение.</tspan>
    </text>

    <g transform="translate(0 735)" filter="url(#shadow)">
      <rect width="936" height="390" rx="32" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
      <rect width="936" height="8" rx="4" fill="#FF6B00"/>

      <g transform="translate(38 48)">
        <circle cx="28" cy="28" r="28" fill="#D0FAE5"/>
        <text class="label" x="28" y="35" font-size="17" fill="#007956" text-anchor="middle">01</text>
        <text class="body" data-slot="step1.title" x="82" y="24" font-size="25" font-weight="700" fill="#0A0A0A">Забележи кога се случва</text>
        <text class="body" data-slot="step1.desc" x="82" y="58" font-size="21" fill="#737373">При миене, спонтанно или заедно с болка?</text>
      </g>
      <line x1="38" y1="138" x2="898" y2="138" stroke="#E5E5E5" stroke-width="2"/>
      <g transform="translate(38 166)">
        <circle cx="28" cy="28" r="28" fill="#D0FAE5"/>
        <text class="label" x="28" y="35" font-size="17" fill="#007956" text-anchor="middle">02</text>
        <text class="body" data-slot="step2.title" x="82" y="24" font-size="25" font-weight="700" fill="#0A0A0A">Продължи с нежна хигиена</text>
        <text class="body" data-slot="step2.desc" x="82" y="58" font-size="21" fill="#737373">Не спирай миенето заради кървенето.</text>
      </g>
      <line x1="38" y1="256" x2="898" y2="256" stroke="#E5E5E5" stroke-width="2"/>
      <g transform="translate(38 284)">
        <circle cx="28" cy="28" r="28" fill="#0A0A0A"/>
        <text class="label" x="28" y="35" font-size="17" fill="#FFFFFF" text-anchor="middle">03</text>
        <text class="body" data-slot="step3.title" x="82" y="24" font-size="25" font-weight="700" fill="#0A0A0A">Потърси професионална оценка</text>
        <text class="body" data-slot="step3.desc" x="82" y="58" font-size="21" fill="#737373">Особено ако сигналът продължава или се усилва.</text>
      </g>
    </g>

    <g transform="translate(0 1190)">
      <text class="body" data-slot="disclaimer" x="0" y="25" font-size="21" font-weight="700" fill="#007956">Ориентир, не диагноза.</text>
      <g transform="translate(650 0)">
        <rect width="286" height="58" rx="29" fill="#0A0A0A"/>
        <text class="body" data-slot="cta" x="143" y="37" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Прочети повече →</text>
      </g>
    </g>
  </g>
</svg>
