<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Интерактивен Story шаблон Zubite.bg</title>
  <desc id="desc">Вертикален шаблон с един наблюдаем въпрос и три отговора за ориентация.</desc>
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Regular.ttf')}@font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Bold.ttf');font-weight:700}@font-face{font-family:Playfair;src:url('../../fonts/taste/PlayfairDisplay-Regular.ttf')}@font-face{font-family:Plex;src:url('../../fonts/taste/IBMPlexMono-Medium.ttf');font-weight:600}
      .display{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-6px}.body{font-family:Manrope,Arial,sans-serif}.label{font-family:Plex,monospace;font-weight:600;letter-spacing:3px}.accent{font-family:Playfair,Georgia,serif;font-style:italic}.brand{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-2.4px}
    </style>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#0A0A0A" stroke-opacity=".035" stroke-width="2"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0A0A0A" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="#F5F4F2"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <circle cx="1014" cy="298" r="260" fill="#D0FAE5" opacity=".78"/>
  <circle cx="1014" cy="298" r="154" fill="none" stroke="#007956" stroke-opacity=".18" stroke-width="3"/>
  <path d="M0 1700C210 1580 404 1616 596 1920H0Z" fill="#FF6B00" opacity=".12"/>

  <g transform="translate(84 186)">
    <text class="brand" x="0" y="38" font-size="42" fill="#0A0A0A">Zubite<tspan fill="#007956">.bg</tspan></text>
    <g transform="translate(0 92)"><rect width="320" height="50" rx="25" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/><circle cx="28" cy="25" r="7" fill="#00D294"/><text class="label" data-slot="eyebrow" x="52" y="32" font-size="19" fill="#007956">БЪРЗ ОРИЕНТИР · STORY</text></g>

    <text class="display" data-slot="headline" x="0" y="370" font-size="116" fill="#0A0A0A">
      <tspan x="0">Какво</tspan>
      <tspan x="0" dy="112">забелязваш</tspan>
      <tspan class="accent" x="0" dy="118" fill="#007956" letter-spacing="-2">най-често?</tspan>
    </text>
    <text class="body" data-slot="body" x="0" y="748" font-size="36" fill="#525252">
      <tspan x="0">Не е нужно да знаеш медицинския термин.</tspan>
      <tspan x="0" dy="52">Избери това, което виждаш или усещаш.</tspan>
    </text>

    <g transform="translate(0 890)" filter="url(#shadow)">
      <rect width="912" height="496" rx="42" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
      <g transform="translate(38 38)">
        <rect width="836" height="116" rx="26" fill="#FFF8F2" stroke="#FFB77E" stroke-width="2"/>
        <circle cx="58" cy="58" r="30" fill="#FF6B00"/><text class="label" x="58" y="65" font-size="18" fill="#FFFFFF" text-anchor="middle">A</text>
        <text class="body" data-slot="optionA" x="112" y="68" font-size="30" font-weight="700" fill="#0A0A0A">Криви или струпани зъби</text>
      </g>
      <g transform="translate(38 190)">
        <rect width="836" height="116" rx="26" fill="#F7FCFA" stroke="#B9DDCF" stroke-width="2"/>
        <circle cx="58" cy="58" r="30" fill="#D0FAE5"/><text class="label" x="58" y="65" font-size="18" fill="#007956" text-anchor="middle">B</text>
        <text class="body" data-slot="optionB" x="112" y="68" font-size="30" font-weight="700" fill="#0A0A0A">Щракане или напрежение</text>
      </g>
      <g transform="translate(38 342)">
        <rect width="836" height="116" rx="26" fill="#F7FCFA" stroke="#B9DDCF" stroke-width="2"/>
        <circle cx="58" cy="58" r="30" fill="#D0FAE5"/><text class="label" x="58" y="65" font-size="18" fill="#007956" text-anchor="middle">C</text>
        <text class="body" data-slot="optionC" x="112" y="68" font-size="30" font-weight="700" fill="#0A0A0A">Дишане през устата</text>
      </g>
    </g>

    <g transform="translate(0 1480)">
      <rect width="912" height="76" rx="38" fill="#0A0A0A"/>
      <text class="body" data-slot="cta" x="456" y="48" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">Провери своя случай →</text>
    </g>
    <text class="body" data-slot="disclaimer" x="0" y="1634" font-size="23" font-weight="700" fill="#007956">Ориентир, не диагноза.</text>
    <text class="body" data-slot="url" x="912" y="1634" font-size="21" fill="#737373" text-anchor="end">zubite.bg/quiz</text>
  </g>
</svg>
