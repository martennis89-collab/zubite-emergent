<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Корица за Reel Zubite.bg</title>
  <desc id="desc">Вертикална корица за кратко видео за захапката с безопасна централна зона.</desc>
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Regular.ttf')}@font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Bold.ttf');font-weight:700}@font-face{font-family:Playfair;src:url('../../fonts/taste/PlayfairDisplay-Regular.ttf')}@font-face{font-family:Plex;src:url('../../fonts/taste/IBMPlexMono-Medium.ttf');font-weight:600}
      .display{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-7px}.body{font-family:Manrope,Arial,sans-serif}.label{font-family:Plex,monospace;font-weight:600;letter-spacing:3px}.accent{font-family:Playfair,Georgia,serif;font-style:italic}.brand{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-2.4px}
    </style>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCECE7"/><stop offset="1" stop-color="#EFE8DD"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="#0A0A0A"/>
  <path d="M0 0H1080V470C866 356 704 378 536 438C322 514 162 472 0 382Z" fill="#007956"/>
  <circle cx="954" cy="212" r="186" fill="#00D294" opacity=".14"/>

  <g transform="translate(84 184)">
    <text class="brand" x="0" y="40" font-size="42" fill="#FFFFFF">Zubite<tspan fill="#00D294">.bg</tspan></text>
    <g transform="translate(0 96)"><rect width="360" height="52" rx="26" fill="#D0FAE5"/><circle cx="28" cy="26" r="7" fill="#00D294"/><text class="label" x="52" y="33" font-size="19" fill="#007956">30 СЕКУНДИ · ЯСНО ОБЯСНЕНИЕ</text></g>

    <text class="display" x="0" y="382" font-size="122" fill="#FFFFFF">
      <tspan x="0">Захапката</tspan>
      <tspan class="accent" x="0" dy="122" fill="#FF6B00" letter-spacing="-2">за 30 секунди.</tspan>
    </text>
    <text class="body" x="0" y="664" font-size="34" fill="#D4D4D4">
      <tspan x="0">Какво можеш да забележиш сам —</tspan>
      <tspan x="0" dy="50">и какво изисква професионален преглед.</tspan>
    </text>

    <g transform="translate(0 820)" filter="url(#shadow)">
      <rect width="912" height="610" rx="46" fill="url(#photo)"/>
      <circle cx="456" cy="240" r="112" fill="#FFFFFF" fill-opacity=".62" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="456" cy="214" r="54" fill="#007956" opacity=".22"/>
      <path d="M326 474c22-112 68-168 130-168s108 56 130 168" fill="#007956" opacity=".18"/>
      <g transform="translate(376 202)"><circle cx="80" cy="80" r="64" fill="#0A0A0A" fill-opacity=".88"/><path d="m68 54 36 26-36 26Z" fill="#FFFFFF"/></g>
      <g transform="translate(30 520)"><rect width="852" height="66" rx="33" fill="#FFFFFF" fill-opacity=".92"/><text class="body" x="426" y="42" font-size="23" font-weight="700" fill="#0A0A0A" text-anchor="middle">Замени с кадър на експерт, пациент или ясна демонстрация</text></g>
    </g>

    <g transform="translate(0 1510)">
      <rect width="286" height="64" rx="32" fill="#FF6B00"/>
      <text class="body" x="143" y="41" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">Гледай видеото →</text>
      <text class="body" x="912" y="40" font-size="22" fill="#BDBDBD" text-anchor="end">Ориентир, не диагноза.</text>
    </g>
  </g>
</svg>
