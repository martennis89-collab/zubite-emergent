<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Шаблон за прозрачност при подбора на клиники Zubite.bg</title>
  <desc id="desc">Обяснение на критериите за насочване към клиники, без класация или обещание.</desc>
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Regular.ttf')}@font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Bold.ttf');font-weight:700}@font-face{font-family:Playfair;src:url('../../fonts/taste/PlayfairDisplay-Regular.ttf')}@font-face{font-family:Plex;src:url('../../fonts/taste/IBMPlexMono-Medium.ttf');font-weight:600}
      .display{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-5px}.body{font-family:Manrope,Arial,sans-serif}.label{font-family:Plex,monospace;font-weight:600;letter-spacing:2.8px}.accent{font-family:Playfair,Georgia,serif;font-style:italic}.brand{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-2.4px}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0A0A0A" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1080" height="1350" fill="#F5F4F2"/>
  <path d="M782 0H1080V382C940 334 842 230 782 0Z" fill="#FF6B00" opacity=".12"/>
  <path d="M0 1146C206 1054 364 1098 510 1350H0Z" fill="#D0FAE5"/>

  <g transform="translate(72 72)">
    <text class="brand" x="0" y="34" font-size="38" fill="#0A0A0A">Zubite<tspan fill="#007956">.bg</tspan></text>
    <text class="label" data-slot="eyebrow" x="936" y="30" font-size="17" fill="#CC5400" text-anchor="end">ПРОЗРАЧЕН ПРОЦЕС · 01</text>

    <text class="display" data-slot="headline" x="0" y="236" font-size="88" fill="#0A0A0A">
      <tspan x="0">Как подбираме</tspan>
      <tspan x="0" dy="90">клиниките?</tspan>
    </text>
    <text class="accent" data-slot="kicker" x="0" y="456" font-size="54" fill="#007956">Насочване, не класация.</text>
    <text class="body" data-slot="body" x="0" y="526" font-size="28" fill="#525252">
      <tspan x="0">Не продаваме „най-добрата“ клиника. Показваме</tspan>
      <tspan x="0" dy="43">релевантни възможности според ясни сигнали.</tspan>
    </text>

    <g transform="translate(0 650)" filter="url(#shadow)">
      <rect width="936" height="432" rx="32" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
      <g transform="translate(36 36)">
        <rect width="264" height="360" rx="24" fill="#FFF8F2" stroke="#FFD8BC" stroke-width="2"/>
        <text class="label" data-slot="col1.label" x="24" y="44" font-size="17" fill="#CC5400">01 · ГРАД</text>
        <circle cx="132" cy="135" r="50" fill="#FFFFFF" stroke="#FF6B00" stroke-width="3"/>
        <path d="M132 103c-20 0-36 16-36 36 0 28 36 61 36 61s36-33 36-61c0-20-16-36-36-36Zm0 48a14 14 0 1 1 0-28 14 14 0 0 1 0 28Z" fill="#FF6B00"/>
        <text class="body" data-slot="col1.title" x="24" y="247" font-size="25" font-weight="700" fill="#0A0A0A">Къде търсиш?</text>
        <text class="body" data-slot="col1.desc" x="24" y="286" font-size="20" fill="#737373"><tspan x="24">Локацията е</tspan><tspan x="24" dy="30">практичен филтър.</tspan></text>
      </g>
      <g transform="translate(336 36)">
        <rect width="264" height="360" rx="24" fill="#F7FCFA" stroke="#B9DDCF" stroke-width="2"/>
        <text class="label" data-slot="col2.label" x="24" y="44" font-size="17" fill="#007956">02 · ТЕМА</text>
        <circle cx="132" cy="135" r="50" fill="#D0FAE5"/>
        <path d="M105 139h54M115 119c8-12 26-16 40 0M115 159c10 11 28 11 38 0" fill="none" stroke="#007956" stroke-width="5" stroke-linecap="round"/>
        <text class="body" data-slot="col2.title" x="24" y="247" font-size="25" font-weight="700" fill="#0A0A0A">Какъв е сигналът?</text>
        <text class="body" data-slot="col2.desc" x="24" y="286" font-size="20" fill="#737373"><tspan x="24">Съпоставяме го с</tspan><tspan x="24" dy="30">публикувани услуги.</tspan></text>
      </g>
      <g transform="translate(636 36)">
        <rect width="264" height="360" rx="24" fill="#F7FCFA" stroke="#B9DDCF" stroke-width="2"/>
        <text class="label" data-slot="col3.label" x="24" y="44" font-size="17" fill="#007956">03 · ПРОФИЛ</text>
        <circle cx="132" cy="135" r="50" fill="#0A0A0A"/>
        <path d="m108 137 16 16 34-38" fill="none" stroke="#00D294" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="body" data-slot="col3.title" x="24" y="247" font-size="25" font-weight="700" fill="#0A0A0A">Какво е проверимо?</text>
        <text class="body" data-slot="col3.desc" x="24" y="286" font-size="20" fill="#737373"><tspan x="24">Екип, услуги и</tspan><tspan x="24" dy="30">налична информация.</tspan></text>
      </g>
    </g>

    <g transform="translate(0 1148)">
      <circle cx="20" cy="20" r="20" fill="#D0FAE5"/><path d="m11 20 6 6 12-14" fill="none" stroke="#007956" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="body" data-slot="disclaimer" x="55" y="27" font-size="21" font-weight="700" fill="#007956">Решението остава твое.</text>
      <rect x="650" width="286" height="58" rx="29" fill="#0A0A0A"/>
      <text class="body" data-slot="cta" x="793" y="37" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Виж критериите →</text>
    </g>
  </g>
</svg>
