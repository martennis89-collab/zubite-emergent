<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 1190 1684" role="img" aria-labelledby="title desc">
  <title id="title">Zubite.bg постер за събиране на отзиви — A3</title>
  <desc id="desc">Печатен A3 постер, който клиниките поставят в приемната, за да поканят пациентите да сканират QR код и да оставят кратка обратна връзка. Място за QR код и за лого на клиниката.</desc>
  <defs>
    <style>
      @font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Regular.ttf')}@font-face{font-family:Manrope;src:url('../../fonts/taste/Manrope-Bold.ttf');font-weight:700}@font-face{font-family:Playfair;src:url('../../fonts/taste/PlayfairDisplay-Regular.ttf')}@font-face{font-family:Plex;src:url('../../fonts/taste/IBMPlexMono-Medium.ttf');font-weight:600}
      .display{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-4px}.body{font-family:Manrope,Arial,sans-serif}.label{font-family:Plex,monospace;font-weight:600;letter-spacing:2.8px}.accent{font-family:Playfair,Georgia,serif;font-style:italic}.brand{font-family:Manrope,Arial,sans-serif;font-weight:700;letter-spacing:-2.4px}
    </style>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#0A0A0A" flood-opacity=".10"/></filter>
  </defs>

  <!-- Canvas: Warm Paper (§3) -->
  <rect width="1190" height="1684" fill="#F5F4F2"/>
  <!-- Editorial structure, layer 2 (§7): one precision-border frame, not a blur blob -->
  <rect x="40" y="40" width="1110" height="1604" fill="none" stroke="#E5E5E5" stroke-width="2"/>
  <!-- Quiet geometric fields (asymmetry, no glow) -->
  <path d="M905 40H1150V300C1030 262 950 178 905 40Z" fill="#FF6B00" opacity=".10"/>
  <path d="M40 1440C220 1360 360 1400 486 1644H40Z" fill="#D0FAE5" opacity=".7"/>

  <g transform="translate(90 96)">
    <!-- Wordmark (§5): Editorial Ink + Trust Emerald .bg. Clinic logo never sits here. -->
    <text class="brand" x="0" y="42" font-size="48" fill="#0A0A0A">Zubite<tspan fill="#007956">.bg</tspan></text>

    <!-- Precision divider (replaces dotted/blob motif) -->
    <rect x="0" y="96" width="168" height="3" fill="#0A0A0A"/>

    <!-- Eyebrow label -->
    <text class="label" x="0" y="158" font-size="21" fill="#007956">ОБРАТНА ВРЪЗКА ОТ ПАЦИЕНТИ</text>

    <!-- Hero headline: one Playfair accent word in Signal Orange (§4) -->
    <text class="display" x="0" y="270" font-size="96" fill="#0A0A0A">Споделете <tspan class="accent" font-size="96" fill="#FF6B00" letter-spacing="0">мнение</tspan></text>
    <text class="display" x="0" y="374" font-size="96" fill="#0A0A0A">за вашето посещение</text>

    <!-- Clinic name / city line (editable placeholder) -->
    <text class="body" x="0" y="452" font-size="34" fill="#525252"><tspan font-weight="700" fill="#0A0A0A">[ Име на клиниката ]</tspan><tspan fill="#737373"> · [ Град ]</tspan></text>

    <!-- Evidence/action surface (§7, layer 3): white panel, 1px border, one QR next step -->
    <g transform="translate(195 512)" filter="url(#cardShadow)">
      <rect width="620" height="622" rx="34" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"/>
      <text class="label" x="310" y="86" font-size="20" fill="#CC5400" text-anchor="middle">СКАНИРАЙ · ОСТАВИ ОТЗИВ</text>

      <!-- QR placeholder: paste the clinic's unique review-link QR here.
           Finder-pattern corners signal "QR goes here"; keep it square. -->
      <g transform="translate(85 122)">
        <rect width="450" height="450" rx="20" fill="#F5F4F2" stroke="#0A0A0A" stroke-width="2.5" stroke-dasharray="10 12"/>
        <!-- finder patterns -->
        <g fill="none" stroke="#0A0A0A" stroke-width="12">
          <rect x="34" y="34" width="86" height="86" rx="6"/>
          <rect x="330" y="34" width="86" height="86" rx="6"/>
          <rect x="34" y="330" width="86" height="86" rx="6"/>
        </g>
        <g fill="#0A0A0A">
          <rect x="61" y="61" width="32" height="32" rx="3"/>
          <rect x="357" y="61" width="32" height="32" rx="3"/>
          <rect x="61" y="357" width="32" height="32" rx="3"/>
        </g>
        <text class="body" x="225" y="228" font-size="24" font-weight="700" fill="#737373" text-anchor="middle">Постави тук</text>
        <text class="body" x="225" y="262" font-size="24" font-weight="700" fill="#737373" text-anchor="middle">QR код за отзиви</text>
      </g>
    </g>

    <!-- Instruction under the card -->
    <text class="body" x="505" y="1200" font-size="30" fill="#0A0A0A" text-anchor="middle">Сканирайте QR кода с телефона си и оставете кратка обратна връзка.</text>

    <!-- Footer: sign-off (left) + clinic logo (right) (§1, §5) -->
    <line x1="0" y1="1290" x2="1010" y2="1290" stroke="#E5E5E5" stroke-width="2"/>
    <text class="body" x="0" y="1336" font-size="26" fill="#0A0A0A"><tspan x="0">Вашето мнение помага на други</tspan><tspan x="0" dy="34">пациенти да направят по-информиран избор.</tspan></text>

    <!-- Clinic logo placeholder — never an equal lockup with the wordmark (§5) -->
    <g transform="translate(740 1300)">
      <rect width="270" height="72" rx="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="8 8"/>
      <text class="body" x="135" y="43" font-size="18" fill="#B4B4B4" text-anchor="middle">Лого на клиниката</text>
    </g>
  </g>
</svg>
