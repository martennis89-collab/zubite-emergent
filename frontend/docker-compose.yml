services:
  zubite-frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zubite-frontend-dev
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - zubite_node_modules:/app/node_modules
      - zubite_claude_config:/root/.claude
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sleep infinity

volumes:
  zubite_node_modules:
  zubite_claude_config: