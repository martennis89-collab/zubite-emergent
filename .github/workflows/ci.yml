name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_INTERNAL_URL: http://127.0.0.1:9
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_SITE_URL: https://zubite.bg
      REVALIDATE_SECRET: ci-only-revalidation-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: zubite_ci
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      REVALIDATE_SECRET: ci-only-revalidation-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q tests/test_storage_r2.py
